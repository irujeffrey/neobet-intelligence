name: Monitor NeoBet NBA shadow forecasts

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync NeoBet sports data"]
    types: [completed]

permissions:
  contents: read

jobs:
  shadow-monitor:
    name: Save NO BET forecasts and score settled games
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate current-day NBA shadow forecasts
        run: node scripts/generate-basketball-shadow-predictions.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: efb484b0-ea00-49c8-9955-165b1f003b95

      - name: Store forecasts as unpublished NO BET drafts
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute neobet-intelligence-db --remote --file ${{ runner.temp }}/neobet-basketball-shadow-predictions.sql

      - name: Review prospective settled NBA forecasts
        run: node scripts/evaluate-basketball-shadow-predictions.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: efb484b0-ea00-49c8-9955-165b1f003b95

      - name: Save private shadow evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: neobet-basketball-shadow-evaluation
          path: ${{ runner.temp }}/neobet-basketball-shadow-evaluation.json
          if-no-files-found: error
          retention-days: 30
