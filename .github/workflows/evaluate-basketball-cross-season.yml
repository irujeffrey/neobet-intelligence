name: Evaluate NeoBet NBA cross-season model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate NBA across complete seasons
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download licensed history and evaluate untouched season
        run: node scripts/evaluate-basketball-cross-season.mjs

      - name: Save detailed evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: neobet-basketball-cross-season-evaluation
          path: ${{ runner.temp }}/neobet-basketball-cross-season-evaluation.json
          if-no-files-found: error
          retention-days: 90
