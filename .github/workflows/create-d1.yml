name: Create NeoBet D1 database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-database:
    name: Create database in Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create D1 database in Western Europe
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 create neobet-intelligence-db --location=weur
